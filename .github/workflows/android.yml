name: Build and Sign APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Patch APK
        run: |
          python3 patch_apk.py

      - name: Zipalign APK
        run: |
          # Localizar o zipalign no Android SDK
          ZIPALIGN_PATH=$(find $ANDROID_HOME/build-tools -name zipalign | sort -r | head -n 1)
          if [ -z "$ZIPALIGN_PATH" ]; then
            echo "Erro: zipalign não encontrado no Android SDK!"
            exit 1
          fi
          echo "Usando zipalign em: $ZIPALIGN_PATH"
          mv proxyandroid_unsigned.apk proxyandroid_unaligned.apk
          $ZIPALIGN_PATH -v 4 proxyandroid_unaligned.apk proxyandroid_unsigned.apk

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: .
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proxyandroid-no-login
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
